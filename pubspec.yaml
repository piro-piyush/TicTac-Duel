name: tictac_duel
description: "Real-time multiplayer Tic-Tac-Toe"
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_svg: ^2.3.0
  lottie: ^3.6.1
  flutter_confetti: ^0.9.2

  # Navigation & State
  get: ^4.7.3

  # Storage
  flutter_secure_storage: ^11.2.0

  # Networking & Realtime
  dio: ^5.11.1
  socket_io_client: ^3.1.6
  flutter_dotenv: ^6.0.1
  connectivity_plus: ^7.3.1

  # Audio & Utilities
  just_audio: ^0.10.6
  equatable: ^3.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animations/
    - assets/audio/

# ─────────────────────────────────────────────────────────────
# App Icons
# ─────────────────────────────────────────────────────────────

icons_launcher:
  platforms:
    android:
      enable: true
      image_path: assets/app/icon_foreground.png
      adaptive_background_image: assets/app/icon_background.png
      adaptive_foreground_image: assets/app/icon_foreground.png

    ios:
      enable: true
      image_path: assets/app/icon_foreground.png

# ─────────────────────────────────────────────────────────────
# Native Splash Screen
# ─────────────────────────────────────────────────────────────

flutter_native_splash:
  color: "#080B14"
  image: assets/app/icon_foreground.png
  fullscreen: true

  android: true
  ios: true
  web: true

  android_12:
    color: "#080B14"
    image: assets/app/splash_android12.png