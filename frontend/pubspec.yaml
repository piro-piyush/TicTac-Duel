name: tictac_duel
description: "Real-time multiplayer Tic-Tac-Toe"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  socket_io_client: ^3.1.6
  provider: ^6.1.5+1
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/app/logo.png

icons_launcher:
  image_path: "assets/app/logo.png"

  platforms:
    android:
      enable: true
    ios:
      enable: true