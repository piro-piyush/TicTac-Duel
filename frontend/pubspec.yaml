name: tictac_duel
description: "Real-time multiplayer Tic-Tac-Toe"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  socket_io_client: ^3.1.6
  provider: ^6.1.5+1
  go_router: ^18.0.1
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.8
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.3.0
  audioplayers: ^6.8.1
  flutter_confetti: ^0.9.2
  just_audio: ^0.10.6
  shared_preferences: ^2.5.5
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/app/
    - assets/animations/
    - assets/audio/
    - .env

icons_launcher:
  platforms:
    android:
      enable: true
      image_path: "assets/app/icon_foreground.png"
      adaptive_background_image: "assets/app/icon_background.png"
      adaptive_foreground_image: "assets/app/icon_foreground.png"

    ios:
      enable: true
      image_path: "assets/app/icon_foreground.png"
flutter_native_splash:
  color: "#080B14"
  image: assets/app/icon_foreground.png

  fullscreen: true

  android: true
  ios: true
  web: true

  android_12:
    color: "#080B14"
    image: assets/app/splash_android12.png
#    icon_background_color: "#080B14"