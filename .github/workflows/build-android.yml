
name: Build Flutter Android

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

# Cancel an older run when a newer run starts for the same ref.
concurrency:
  group: build-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # CHECKOUT AND TOOLCHAIN
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      # --------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------
      - name: Get Dependencies
        run: flutter pub get

      # --------------------------------------------------
      # ENVIRONMENT
      # --------------------------------------------------
      - name: Create Environment File
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            test -n "$BASE_URL" || {
              echo "::error::BASE_URL secret is missing."
              exit 1
            }
          fi

          # Forked PRs may not have access to repository secrets.
          # The placeholder is only for PR validation builds.
          printf 'BASE_URL=%s\n' \
            "${BASE_URL:-https://example.invalid}" > .env

          echo "Environment file created."

      # --------------------------------------------------
      # ANDROID SIGNING
      # Only required for release builds, not PR validation.
      # --------------------------------------------------
      - name: Restore Android Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks
          echo "Android keystore restored."

      - name: Create key.properties
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD" || {
            echo "::error::KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::KEY_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::KEY_ALIAS secret is missing."
            exit 1
          }

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Verify Signing Files
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test -s android/app/upload-keystore.jks
          test -s android/key.properties
          echo "Android signing files verified."

      # --------------------------------------------------
      # DIAGNOSE KOTLIN MAVEN RESOLUTION
      # --------------------------------------------------
      - name: Check Kotlin Maven Artifact
        shell: bash
        run: |
          set -euo pipefail

          URL="https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugins-bom/2.2.0/kotlin-gradle-plugins-bom-2.2.0.pom"

          STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output /tmp/kotlin-bom.pom \
            --write-out "%{http_code}" \
            "$URL") || true

          echo "Kotlin BOM HTTP status: ${STATUS:-connection failed}"

          if [[ "$STATUS" != "200" ]]; then
            echo "::error::Kotlin BOM is not reachable from the runner."
            exit 1
          fi

          echo "Kotlin BOM is reachable."

      # --------------------------------------------------
      # VERSION
      # --------------------------------------------------
      - name: Read App Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)

          if [[ "$VERSION" != *"+"* ]]; then
            echo "::error::Expected pubspec.yaml version in version+build format."
            exit 1
          fi

          APP_VERSION="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION##*+}"

          if [[ -z "$APP_VERSION" || -z "$BUILD_NUMBER" ]]; then
            echo "::error::Invalid app version: $VERSION"
            exit 1
          fi

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          echo "App Version: $APP_VERSION"
          echo "Build Number: $BUILD_NUMBER"

      # --------------------------------------------------
      # VALIDATION
      # --------------------------------------------------
      - name: Analyze Flutter Code
        run: flutter analyze

      # --------------------------------------------------
      # PULL REQUEST VALIDATION BUILD
      # No signing secrets needed.
      # --------------------------------------------------
      - name: Build Debug APK
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Upload Debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------
      # SIGNED RELEASE BUILDS
      # Used for branch pushes, tags and manual runs.
      # --------------------------------------------------
      - name: Build Split Release APKs
        if: github.event_name != 'pull_request'
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --no-pub

      - name: Build Release AAB
        if: github.event_name != 'pull_request'
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: |
          flutter build appbundle \
            --release \
            --no-pub

      # --------------------------------------------------
      # LIST BUILD OUTPUTS
      # --------------------------------------------------
      - name: List Build Outputs
        if: always()
        shell: bash
        run: |
          echo "===== APK OUTPUTS ====="
          find build/app/outputs/flutter-apk \
            -name "*.apk" -print 2>/dev/null || true

          echo ""
          echo "===== AAB OUTPUTS ====="
          find build/app/outputs/bundle/release \
            -name "*.aab" -print 2>/dev/null || true

      # --------------------------------------------------
      # UPLOAD SIGNED RELEASE ARTIFACTS
      # --------------------------------------------------
      - name: Upload armeabi-v7a APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64-v8a APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # CREATE GITHUB RELEASE FOR VERSION TAGS ONLY
      # --------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tic Tac Duel ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab

      # --------------------------------------------------
      # SUMMARY
      # --------------------------------------------------
      - name: Report Build Summary
        if: always()
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Tic Tac Duel Android Build"
            echo ""
            echo "- Event: $EVENT_NAME"
            echo "- Ref: $REF_NAME"
            echo "- App version: ${APP_VERSION:-unavailable}"
            echo "- Build number: ${BUILD_NUMBER:-unavailable}"
            echo "- Run result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"