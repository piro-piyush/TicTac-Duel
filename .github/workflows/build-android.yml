name: Build Flutter Android

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # BUILD AND VALIDATE
  # ============================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Environment
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          printf 'BASE_URL=%s\n' \
            "${BASE_URL:-https://example.invalid}" > .env

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Build Debug APK
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        run: flutter build apk --debug --no-pub

      - name: Upload Debug APK
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # SIGNED RELEASE BUILDS
  # ============================================================
  release-android:
    name: Build Android Release
    needs: build-android
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Environment
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || {
            echo "::error::BASE_URL secret is missing."
            exit 1
          }
          printf 'BASE_URL=%s\n' "$BASE_URL" > .env

      - name: Read App Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          
          if [[ "$VERSION" != *"+"* ]]; then
            echo "::error::Expected version+build format in pubspec.yaml."
            exit 1
          fi
          
          APP_VERSION="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION##*+}"
          
          [[ -n "$APP_VERSION" && -n "$BUILD_NUMBER" ]] || exit 1
          
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate Release Tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$TAG_NAME" != "v$APP_VERSION" ]]; then
            echo "::error::Tag must match pubspec version: v$APP_VERSION"
            exit 1
          fi

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

      - name: Configure Android Signing
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Release APKs
        env:
          GRADLE_OPTS: '-Xmx4g'
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Build Release AAB
        env:
          GRADLE_OPTS: '-Xmx4g'
        run: flutter build appbundle --release --no-pub

      - name: Upload Release APKs and AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tic Tac Duel ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Build Summary
        if: always()
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          {
            echo "## Tic Tac Duel Android Release"
            echo ""
            echo "- Ref: $GITHUB_REF_NAME"
            echo "- Version: ${APP_VERSION:-unavailable}"
            echo "- Build number: ${BUILD_NUMBER:-unavailable}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"