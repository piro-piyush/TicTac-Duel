name: Deploy Flutter Web

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Validate Web
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Environment
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            test -n "$BASE_URL" || {
              echo "::error::BASE_URL secret is missing."
              exit 1
            }
          fi
          
          printf 'BASE_URL=%s\n' \
            "${BASE_URL:-https://example.invalid}" > .env

      - name: Analyze and Build
        run: |
          flutter analyze
          flutter build web --release

      - name: Prepare Web Files
        run: |
          set -euo pipefail
          
          test -s build/web/index.html
          test -s web/.well-known/assetlinks.json
          test -s web/vercel.json
          
          mkdir -p build/web/.well-known
          cp web/.well-known/assetlinks.json build/web/.well-known/
          cp web/vercel.json build/web/

      - name: Upload Build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: flutter-web-build
          path: build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy Web
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
      url: ${{ github.ref_name == 'main' && 'https://tictacduel.vercel.app/' || 'https://dev-tictacduel.vercel.app/' }}

    steps:
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: flutter-web-build
          path: build/web

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          
          for name in \
            VERCEL_TOKEN \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            VERCEL_SCOPE
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name secret is missing."
              exit 1
            fi
          done
          
          test -s build/web/index.html || {
            echo "::error::Flutter web index.html is missing."
            exit 1
          }
          
          mkdir -p build/web/.vercel
          
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" \
            "$VERCEL_PROJECT_ID" \
            > build/web/.vercel/project.json
          
          case "$TARGET_BRANCH" in
            main)
              echo "Deploying main to production..."
          
              vercel deploy \
                --cwd build/web \
                --prod \
                --yes \
                --scope="$VERCEL_SCOPE" \
                --token="$VERCEL_TOKEN"
              ;;
          
            dev)
              echo "Deploying dev to preview..."
          
              DEPLOY_OUTPUT="$(
                vercel deploy \
                  --cwd build/web \
                  --yes \
                  --scope="$VERCEL_SCOPE" \
                  --token="$VERCEL_TOKEN" 2>&1
              )"
          
              printf '%s\n' "$DEPLOY_OUTPUT"
          
              DEPLOYMENT_URL="$(
                printf '%s\n' "$DEPLOY_OUTPUT" |
                  grep -Eo 'https://[^[:space:]]+\.vercel\.app' |
                  grep -v 'vercel\.com/' |
                  tail -n 1 || true
              )"
          
              if [[ -z "$DEPLOYMENT_URL" ]]; then
                echo "::error::Could not determine the preview deployment URL."
                exit 1
              fi
          
              echo "Assigning dev preview domain..."
          
              vercel alias set \
                "$DEPLOYMENT_URL" \
                dev-tictacduel.vercel.app \
                --scope="$VERCEL_SCOPE" \
                --token="$VERCEL_TOKEN"
          
              echo "Dev deployment completed."
              echo "Preview URL: $DEPLOYMENT_URL"
              echo "Stable URL: https://dev-tictacduel.vercel.app/"
              ;;
          
            *)
              echo "::error::Unsupported branch: $TARGET_BRANCH"
              exit 1
              ;;
          esac