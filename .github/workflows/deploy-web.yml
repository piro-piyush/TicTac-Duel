name: Deploy Flutter Web

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Deploy Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Environment
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          set -euo pipefail
          
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            test -n "$BASE_URL" || {
              echo "::error::BASE_URL secret is missing."
              exit 1
            }
          fi
          
          printf 'BASE_URL=%s\n' \
            "${BASE_URL:-https://example.invalid}" > .env

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Prepare Web Files
        run: |
          set -euo pipefail
          
          test -s build/web/index.html
          test -s web/.well-known/assetlinks.json
          test -s web/vercel.json
          
          mkdir -p build/web/.well-known
          
          cp web/.well-known/assetlinks.json \
            build/web/.well-known/assetlinks.json
          
          cp web/vercel.json build/web/vercel.json

      - name: Deploy to Vercel
        if: github.event_name != 'pull_request'
        id: deploy
        working-directory: build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          
          test -n "$VERCEL_TOKEN" || {
            echo "::error::VERCEL_TOKEN secret is missing."
            exit 1
          }
          
          test -n "$VERCEL_ORG_ID" || {
            echo "::error::VERCEL_ORG_ID secret is missing."
            exit 1
          }
          
          test -n "$VERCEL_PROJECT_ID" || {
            echo "::error::VERCEL_PROJECT_ID secret is missing."
            exit 1
          }
          
          mkdir -p .vercel
          
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" \
            > .vercel/project.json
          
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
              > /tmp/vercel-deploy.log 2>&1
          elif [[ "$TARGET_BRANCH" == "dev" ]]; then
            vercel deploy --yes --token="$VERCEL_TOKEN" \
              > /tmp/vercel-deploy.log 2>&1
          else
            echo "::error::Unsupported deployment branch: $TARGET_BRANCH"
            exit 1
          fi
          
          cat /tmp/vercel-deploy.log
          
          DEPLOYMENT_URL=$(
            grep -Eo 'https://[^[:space:]]+' /tmp/vercel-deploy.log |
            grep 'vercel.app' |
            tail -n 1 || true
          )
          
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "::error::Could not determine the deployment URL."
            exit 1
          fi
          
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Report Deployment
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          TARGET_BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Tic Tac Duel Web"
            echo ""
            echo "- Event: $EVENT_NAME"
            echo "- Branch: $TARGET_BRANCH"
            echo "- Deployment: ${DEPLOYMENT_URL:-Not deployed}"
            if [[ -n "$DEPLOYMENT_URL" ]]; then
              echo "- App Links: $DEPLOYMENT_URL/.well-known/assetlinks.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
