name: Build Flutter Android and Web

on:
  pull_request:
    branches:
      - dev
      - "release/**"

  push:
    branches:
      - dev
      - "release/**"
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      # Android signing configuration

      - name: Restore Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Verify Signing Files
        run: |
          test -f android/app/upload-keystore.jks
          test -f android/key.properties
          echo "Android signing files restored successfully."

      # Project setup

      - name: Clean Project
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -rf build

      - name: Get Dependencies
        run: flutter pub get

      - name: Create Environment File
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          test -n "$BASE_URL"
          
          cat > .env <<EOF
          BASE_URL=$BASE_URL
          EOF
          
          echo "Environment file created successfully."

      - name: Read App Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          APP_VERSION="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION##*+}"
          
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          
          echo "App Version: $APP_VERSION"
          echo "Build Number: $BUILD_NUMBER"

      - name: Analyze
        run: flutter analyze

      # Android builds

      - name: Build Split Release APKs
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --no-pub

      - name: Build Release AAB
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: |
          flutter build appbundle \
            --release \
            --no-pub

      # Flutter Web build

      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --no-pub
          
          test -f build/web/index.html
          echo "Flutter Web build completed successfully."

      # Verify build outputs

      - name: List Build Outputs
        if: always()
        run: |
          echo "===== APK ====="
          find build/app/outputs/flutter-apk -name "*.apk" -print || true
          
          echo ""
          echo "===== AAB ====="
          find build/app/outputs/bundle/release -name "*.aab" -print || true
          
          echo ""
          echo "===== WEB ====="
          if [ -f build/web/index.html ]; then
            echo "Flutter Web build exists."
            find build/web -maxdepth 2 -type f -print
          else
            echo "Flutter Web build not found."
          fi

      # Separate Android artifacts

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v5
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v5
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v5
        with:
          name: app-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # Single web artifact; no duplicate ZIP

      - name: Upload Web Build
        uses: actions/upload-artifact@v5
        with:
          name: tictac-duel-web-build
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      # GitHub Release (version tags only)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tic Tac Duel ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
