name: Build Flutter Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v6

      # ============================================================
      # Java
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # Flutter
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      # ============================================================
      # Restore Android Signing
      # ============================================================

      - name: Restore Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Verify Signing Files
        run: |
          test -f android/app/upload-keystore.jks
          test -f android/key.properties
          
          echo "Android signing files restored successfully."

      # ============================================================
      # Clean
      # ============================================================

      - name: Clean Project
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -rf build

      # ============================================================
      # Dependencies
      # ============================================================

      - name: Get Dependencies
        run: flutter pub get

      # ============================================================
      # Environment
      # ============================================================

      - name: Create Environment File
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          test -n "$BASE_URL"
          
          cat > .env <<EOF
          BASE_URL=$BASE_URL
          EOF
          
          echo "Environment file created successfully."

      # ============================================================
      # Version
      # ============================================================

      - name: Read App Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          APP_VERSION="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION##*+}"
          
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          
          echo "App Version: $APP_VERSION"
          echo "Build Number: $BUILD_NUMBER"

      # ============================================================
      # Analyze
      # ============================================================

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      # ============================================================
      # Build Split APKs
      # ============================================================

      - name: Build Split Release APKs
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --no-pub

      # ============================================================
      # Build AAB
      # ============================================================

      - name: Build Release AAB
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: |
          flutter build appbundle \
            --release \
            --no-pub

      # ============================================================
      # List Build Outputs
      # ============================================================

      - name: List Build Outputs
        if: always()
        run: |
          echo "===== APK ====="
          find build/app/outputs/flutter-apk -name "*.apk" -print || true
          
          echo ""
          
          echo "===== AAB ====="
          find build/app/outputs/bundle/release -name "*.aab" -print || true

      # ============================================================
      # Upload ARMv7 APK
      # ============================================================

      - name: Upload armeabi-v7a APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      # ============================================================
      # Upload ARM64 APK
      # ============================================================

      - name: Upload arm64-v8a APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      # ============================================================
      # Upload x86_64 APK
      # ============================================================

      - name: Upload x86_64 APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      # ============================================================
      # Upload AAB
      # ============================================================

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Tic Tac Duel v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab